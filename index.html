<!DOCTYPE html>
<html>
<head>
  <title>Halaman Pertama</title>
  <style>
    body { font-family: sans-serif; background: #111; color: #fff; text-align: center; padding: 40px; }
    h1 { color: #4ade80; }
    button { padding: 10px 20px; font-size: 16px; }
  </style>
</head>
<body>
  <h1>Halo, dunia!</h1>
  <p>Ini halaman web pertama gue.</p>
  <button onclick="ubah()">Klik saya</button>
  <script>
    function ubah() {
      document.querySelector("h1").textContent = "JavaScript jalan!";
    }
  </script>
</body>
</html>
