<!DOCTYPE html>
<html>
<head>
  <title>Halaman Pertama</title>
  <style>
    body { font-family: sans-serif; background: #111; color: #fff; text-align: center; padding: 40px; }
    h1 { color: #4ade80; }
    button { padding: 10px 20px; font-size: 16px; margin: 5px; }
    #angka { font-size: 48px; margin: 20px; }
  </style>
</head>
<body>
  <h1>Halo, dunia!</h1>
  <p>Ini halaman web pertama gue.</p>
  <div id="angka">0</div>
  <button onclick="tambah()">Tambah</button>
  <button onclick="kurang()">Kurang</button>
  <button onclick="reset()">Reset</button>
  <script>
    let hitung = 0;
    function tampil() {
      const el = document.getElementById("angka");
      el.textContent = hitung;
      el.style.color = hitung > 10 ? "red" : "white";
    }
    function tambah() {
      hitung = hitung + 1;
      tampil();
    }
    function kurang() {
      if (hitung > 0) {
        hitung = hitung - 1;
      }
      tampil();
    }
    function reset() {
      hitung = 0;
      tampil();
    }
  </script>
</body>
</html>
